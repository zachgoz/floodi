<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloodCast · Carolina Beach Flood Forecast</title>
    <meta name="description" content="Local water levels, tide forecasts and flood outlooks for Carolina Beach, North Carolina. Set up early access to FloodCast email advisories." />
    <meta property="og:title" content="FloodCast · Carolina Beach Flood Forecast" />
    <meta property="og:description" content="Follow local water levels and upcoming flood conditions in Carolina Beach." />
    <meta property="og:type" content="website" />
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Safari/Chrome UI color to match header (light/dark) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="icon" href="/assets/icon/favicon.svg" type="image/svg+xml" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FloodCast" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <script>
      // Remove the email-unsubscribe capability before any analytics can see it.
      (() => {
      if (window.location.pathname === '/alerts/unsubscribe') {
        const alertToken = new URLSearchParams(window.location.hash.slice(1)).get('token') || new URLSearchParams(window.location.search).get('token');
        if (alertToken) {
          window.__floodcastUnsubscribeToken = alertToken;
          window.history.replaceState(window.history.state, '', window.location.pathname);
        }
      }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
